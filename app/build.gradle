plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.smsforward.app'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.smsforward.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // 매 빌드마다 같은 서명 키를 써야 업데이트 설치가 됨
    signingConfigs {
        fixed {
            storeFile file('fixed-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
