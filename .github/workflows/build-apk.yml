name: APK 빌드

# main 브랜치에 코드가 올라오거나, Actions 탭에서 'Run workflow'를 누르면 실행
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: APK 빌드
        run: gradle :app:assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk sms-forward.apk

      - name: 빌드 결과 보관 (Actions 탭)
        uses: actions/upload-artifact@v4
        with:
          name: sms-forward-apk
          path: sms-forward.apk

      - name: 릴리스로 올리기 (폰에서 바로 받기용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 문자 자동전달 v1.0 (빌드 ${{ github.run_number }})
          body: 폰에서 sms-forward.apk 를 눌러 받은 뒤 설치하세요.
          files: sms-forward.apk
          make_latest: true
